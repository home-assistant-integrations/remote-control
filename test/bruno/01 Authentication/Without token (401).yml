info:
  name: Without token (401)
  type: http
  seq: 2

http:
  method: GET
  url: "{{ha}}/api/states"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "No `Authorization` header. HA answers 401 with the plain-text body `401: Unauthorized`."
