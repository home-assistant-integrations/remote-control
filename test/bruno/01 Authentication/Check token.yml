info:
  name: Check token
  type: http
  seq: 1

http:
  method: GET
  url: "{{ha}}/api/"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: API running.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Sends the token from the collection auth (`Authorization: Bearer {{token}}`). 200 with `{"message":"API running."}` means URL, port and token are right.'
