info:
  name: List dashboards
  type: websocket
  seq: 1

websocket:
  url: "{{haWs}}"
  message:
    - title: auth
      selected: false
      message:
        type: json
        data: '{"type":"auth","access_token":"{{token}}"}'
    - title: list dashboards
      selected: true
      message:
        type: json
        data: '{"id":2,"type":"lovelace/dashboards/list"}'

settings:
  timeout: 0
  keepAliveInterval: 0

docs: Authenticates and lists all dashboards. Bruno sends all messages in order when it connects.
