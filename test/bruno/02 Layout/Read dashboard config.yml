info:
  name: Read dashboard config
  type: websocket
  seq: 2

websocket:
  url: "{{haWs}}"
  message:
    - title: auth
      selected: false
      message:
        type: json
        data: '{"type":"auth","access_token":"{{token}}"}'
    - title: read config
      selected: true
      message:
        type: json
        data: '{"id":1,"type":"lovelace/config","url_path":"{{dashboard}}"}'

settings:
  timeout: 0
  keepAliveInterval: 0

docs: Authenticates and reads the configuration (`views`, cards, actions) of the dashboard `{{dashboard}}`.
