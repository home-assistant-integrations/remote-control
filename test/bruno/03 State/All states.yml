info:
  name: All states
  type: http
  seq: 2

http:
  method: GET
  url: "{{ha}}/api/states"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
