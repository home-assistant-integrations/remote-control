info:
  name: Cover art
  type: http
  seq: 5

http:
  method: GET
  url: "{{ha}}{{entityPicture}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Run *Entity state* first. `entity_picture` carries its own token, so no `Authorization` header is sent. The token changes: read the state again before each fetch. Empty while nothing with artwork plays."
