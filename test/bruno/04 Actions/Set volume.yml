info:
  name: Set volume
  type: http
  seq: 4

http:
  method: POST
  url: "{{ha}}/api/services/media_player/volume_set"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "entity_id": "{{mediaPlayer}}",
        "volume_level": 0.4
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Calls `media_player.volume_set`. Triggers the real device.
