schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
context: |
  Tech stack: M5Paper, C, C++, WebSockets, Home Assistant
  We use conventional commits
  Domain: Remote Control for Home Assistant running on M5Paper devices

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 10 Minutes of work
    - The last task of every change updates the Unreleased section of CHANGELOG.md (Keep a Changelog 1.1.0)
  changelog:
    - Use the Keep a Changelog format (https://keepachangelog.com/en/1.1.0/)
    - Always include an "Unreleased" section
    - Update the "Unreleased" section with every change
  general:
    - Use the imperative mood in commit messages
    - Use conventional commits (https://www.conventionalcommits.org/en/v1.0.0/)
    - Use the present tense in commit messages
    - Use the active voice in commit messages
    - Create a new branch for every change and a PR when when finished
